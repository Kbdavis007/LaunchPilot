name: Deploy

on:
  push:
    branches: [main]
    # A docs-only or Markdown-only change does not affect what this pipeline
    # builds or deploys, so do not start a run at all.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'
      - '.openhands/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'
      - '.openhands/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Serialise deployments so an infrastructure apply never overlaps a code push.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # Decide what actually changed. A manual run always exercises every stage.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' }}
      code: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'terraform/**'
              - 'apps/worker/**'
              - 'wrangler.jsonc'
              - 'migrations/**'
              - '.github/workflows/deploy.yml'
            code:
              - 'apps/pages/**'
              - 'content/**'
              - '.github/workflows/deploy.yml'

  # Build once; both downstream stages consume these artifacts.
  build:
    name: Build (verify + bundle)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (EDGE-001 / EDGE-002 guardrails)
        run: npm run lint

      - name: Validate OpenSpec contracts
        run: npx --yes @fission-ai/openspec@latest validate --all

      - name: Verify blog seed migration is current
        run: node scripts/seed-blog.mjs --check

      - name: Build worker bundle
        run: npm run build:worker

      - name: Build Pages site
        run: npm run build --workspace @launchpilot/pages

      - name: Upload worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: worker-dist
          path: apps/worker/dist
          retention-days: 1

      - name: Upload Pages site
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: apps/pages/dist
          retention-days: 1

  # Infrastructure stage: Terraform owns the Cloudflare resources and the worker
  # script upload. Runs only when infrastructure inputs change.
  infra:
    name: Infrastructure (Terraform)
    needs: [changes, build]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download worker bundle
        uses: actions/download-artifact@v4
        with:
          name: worker-dist
          path: apps/worker/dist

      - name: Check state backend credentials
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are not set. See docs/deployment.md section 4a."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Write backend config
        working-directory: terraform
        run: |
          cat > backend.hcl <<EOF
          bucket = "launchpilot-tfstate"
          key    = "production/terraform.tfstate"
          region = "auto"
          endpoints = { s3 = "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" }
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          use_path_style              = true
          use_lockfile                = true
          EOF

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export Terraform outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: terraform
        run: terraform output -json > "${{ github.workspace }}/terraform-outputs.json"

      - name: Upload Terraform outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform-outputs.json
          retention-days: 1

  # Code stage: applies D1 migrations and publishes the frontend. Runs after
  # infrastructure so the resources and Pages project always exist first.
  deploy-code:
    name: Deploy application
    needs: [changes, build, infra]
    if: |
      always() &&
      needs.changes.outputs.code == 'true' &&
      needs.build.result == 'success' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Pages site
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: apps/pages/dist

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: .
        continue-on-error: true

      - name: Sync resource ids into wrangler.jsonc
        run: |
          if [ -f terraform-outputs.json ]; then
            node scripts/sync-wrangler-ids.mjs terraform-outputs.json
          else
            echo "::warning::no terraform-outputs.json; assuming wrangler.jsonc ids are current"
          fi

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply launchpilot-production --remote --config wrangler.jsonc

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/pages/dist --project-name=launchpilot-saas-pass --branch=main
